services:
  celery-worker:
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start-celery-worker
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  flower:
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start-flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "5557:5555"
    depends_on:
      - redis
      - db

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: fastapi-starter-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  db:
    container_name: fastapi-starter-db
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/15

volumes:
  postgres_data:
    driver: local

networks:
  fastapi-starter:
    driver: bridge

services:
  load-balancer:
    image: nginx
    container_name: fastapi-starter-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    networks:
      - fastapi-starter
    volumes:
      - ./.docker/nginx:/etc/nginx/conf.d

  celery-worker:
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start-celery-worker
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URI}
    restart: unless-stopped
    networks:
      - fastapi-starter
    volumes:
      - .:/app
    depends_on:
      - redis
      - db

  flower:
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start-flower
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URI}
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "5557:5555"
    networks:
      - fastapi-starter
    depends_on:
      - redis
      - db

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - fastapi-starter

  app-1:
    container_name: fastapi-starter-instance-1
    build:
      context: .
      dockerfile: ./.docker/app/Dockerfile
    command: /start
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - fastapi-starter
  # app-2:
  #   container_name: url-shortener-instance-2
  #   build:
  #     dockerfile: ./.docker/app/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     - db
  #   networks:
  #     - url-shortener
  # app-3:
  #   container_name: url-shortener-instance-3
  #   build:
  #     dockerfile: ./.docker/app/Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     - db
  #   networks:
  #     - url-shortener
  db:
    container_name: fastapi-starter-db
    image: postgres:15
    restart: unless-stopped
    networks:
      - fastapi-starter
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "6543:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      PGDATA: /var/lib/postgresql/15

volumes:
  postgres_data:
    driver: local
